<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Style Sheets/styles.css">
    <link rel="stylesheet" href="Style Sheets/contactstyle.css">

    <link rel="icon" href="Images/Website Icon.png">
    <title>Oliver Walker's Portfolio - Contact Me</title>
</head>
<body class="background">
    <nav class="navbar">
        <ul>
            <li><a href="/"><button class="button-navbar" type="submit">Home</button></a></li>
            <li><a href="projects.html"><button class="button-navbar" type="submit">Projects</button></a></li>
            <li><a href="Downloads/Oliver Walker CV - 2025.pdf" target="_blank"><button class="button-navbar" type="submit">CV</button></a></li>
            <li><a href="contact.html"><button class="button-navbar" type="submit">Contact Me</button></a></li>
        </ul>
    </nav>

    <h2>Contact Me</h2>
    <p style="text-align: center; font-size: 20px;">If you have any queries please complete the contact form below</p>

    <div class="cm-form">
        <form action="Scripts/email.php" method="post">
            <p class="warning-text">* required field</p>

            <label for="fname">First Name:<span class="warning-marker">*</span></label>
            <input type="text" id="fname" name="fname" placeholder="Your First Name..." required>

            <label for="sname">Second Name:<span class="warning-marker">*</span></label>
            <input type="text" id="sname" name="sname" placeholder="Your Second Name..." required>

            <label for="company">Company:</label>
            <input type="text" id="company" name="company" placeholder="Company you work for...">

            <label for="pnumber">Phone Number:<span class="warning-marker">*</span></label>
            <input type="text" id="pnumber" name="pnumber" placeholder="Your Phone Number..." required>

            <label for="email">Email Address:<span class="warning-marker">*</span></label>
            <input type="email" id="email" name="email" placeholder="Your Email Address..." required>

            <label for="subject">Subject:<span class="warning-marker">*</span></label>
            <textarea id="subject" name="subject" placeholder="Write something..." style="height: 200px" required></textarea>

            <!-- Google reCAPTCHA widget -->
            <div class="g-recaptcha" 
                 data-sitekey="6LdHvdcrAAAAAPudKkbfjpXbywjE-mgnRWmzbwAW" 
                 data-callback="captchaPassed" 
                 data-expired-callback="captchaExpired"
                 style="display: flex; justify-content: center; margin: 20px 0;">
            </div>

            <div class="generalbutton-container" style="padding-top: 15px;">
                <button class="button-general" type="submit" id="confirm-btn" disabled>Confirm</button>
            </div>
        </form>
    </div>

    <nav class="socialmediabar">
        <ul>
            <li><a href="https://www.instagram.com/oliver_walker01/" target="_blank"><img src="Images/Insta Logo White.png" class="logo-image"></a></li>
            <li><a href="https://github.com/OliWalker01" target="_blank" style="padding-left: 45px; padding-right: 45px;"><img src="Images/Github Logo White.png" class="logo-image"></a></li>
            <li><a href="https://www.linkedin.com/in/oliver-walker-b20448171/" target="_blank"><img src="Images/Linkedin Logo White.png" class="logo-image"></a></li>
            <li><a href="https://youtube.com/@oliverwalker5934?si=fyuc8Efsux3nPn23" target="_blank" style="padding-left: 45px;"><img src="Images/YouTube Icon White.png" class="logo-image"></a></li>
        </ul>
    </nav>

    <!-- Load Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- Script -->
    <script>
        const requiredInputs = document.querySelectorAll("#fname, #sname, #pnumber, #email, #subject");
        const confirmBtn = document.getElementById("confirm-btn");
        let captchaOk = false;

        function checkForm() {
            let allFilled = true;
            requiredInputs.forEach(input => {
                if (!input.value.trim()) {
                    allFilled = false;
                }
            });
            confirmBtn.disabled = !(allFilled && captchaOk);
        }

        requiredInputs.forEach(input => {
            input.addEventListener("input", checkForm);
        });

        // Called when captcha is solved
        function captchaPassed() {
            captchaOk = true;
            checkForm();
        }

        // Called when captcha expires
        function captchaExpired() {
            captchaOk = false;
            checkForm();
        }
    </script>
</body>
</html>
